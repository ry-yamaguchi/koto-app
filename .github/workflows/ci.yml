name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # ローカル開発と npm メジャーを揃える（lock は npm 11 生成。node 22 の npm 10 だと npm ci が不足誤判定する）
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
